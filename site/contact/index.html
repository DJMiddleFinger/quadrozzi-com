<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us | Quadrozzi</title>
  <meta name="description" content="How to reach Quadrozzi.">
  <meta name="theme-color" content="#ffe641">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* The only Quadrozzi page that lists email addresses; every Contact us button on the home page leads here. */
    :root { --yellow: #ffe641; --smoke: #161616; --hazard: repeating-linear-gradient(-45deg, #f6d31c 0 14px, #161616 14px 28px); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 3rem 16px;
      background: var(--yellow); color: var(--smoke); font-family: 'Inter', system-ui, sans-serif; text-align: center;
    }
    body::before, body::after { content: ''; position: fixed; left: 0; right: 0; height: 14px; background: var(--hazard); }
    body::before { top: 0; }
    body::after { bottom: 0; }
    main { width: min(36rem, 100%); }
    h1 {
      font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; font-weight: 800; text-transform: uppercase;
      font-size: clamp(3.5rem, 14vw, 9rem); line-height: .85; margin-bottom: 1.25rem;
    }
    p { font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.5; }
    a { color: inherit; overflow-wrap: anywhere; }

    /* The site's main address: big and first */
    .main-email { margin-top: clamp(2.5rem, 6vw, 3.5rem); }
    .main-email a {
      font-size: clamp(1.7rem, 6vw, 3rem); font-weight: 700; letter-spacing: -.01em;
      text-decoration-thickness: 3px; text-underline-offset: 8px;
    }

    /* Other contacts: smaller, quieter, further down */
    .more { margin-top: clamp(4rem, 10vw, 6rem); display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 2rem; }
    h2 {
      margin-bottom: .4rem; font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; font-weight: 800;
      text-transform: uppercase; font-size: 1.2rem; line-height: 1; letter-spacing: .02em;
    }
    .keep-case { text-transform: none; }   /* "Be" is always written Be, never uppercased */
    .more a { font-size: 1.05rem; font-weight: 500; text-underline-offset: 3px; }

    .back { display: inline-block; margin-top: clamp(3.5rem, 8vw, 4.5rem); padding: .9rem 1.6rem; background: var(--smoke); color: var(--yellow); text-decoration: none; font-weight: 600; }
    .back:hover { background: #000; }
    a:focus-visible { outline: 3px solid var(--smoke); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Contact us</h1>
    <p>Email us and we’ll get back to you, usually within two business days.</p>
    <p class="main-email"><a href="mailto:info@Quadrozzi.com">info@Quadrozzi.com</a></p>
    <div class="more">
      <div><h2 class="keep-case">Be</h2><a href="mailto:Be@Quadrozzi.com">Be@Quadrozzi.com</a></div>
      <div><h2>CTO GBX</h2><a href="mailto:fedor.shot@Quadrozzi.com">fedor.shot@Quadrozzi.com</a></div>
    </div>
    <a class="back" href="../">Back to Quadrozzi</a>
  </main>
</body>
</html>
