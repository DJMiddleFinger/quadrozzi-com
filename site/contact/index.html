<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us | Quadrozzi</title>
  <meta name="description" content="How to reach Quadrozzi.">
  <meta name="theme-color" content="#ffe641">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,401,500,700,900&display=swap" rel="stylesheet">
  <style>
    /* The only Quadrozzi page that lists email addresses; every Contact us button on the home page leads here. */
    :root { --yellow: #ffe641; --smoke: #161616; --hazard: repeating-linear-gradient(-45deg, #f6d31c 0 14px, #161616 14px 28px); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 3rem 16px;
      background: var(--yellow); color: var(--smoke); font-family: 'Satoshi', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
    }
    body::before, body::after { content: ''; position: fixed; left: 0; right: 0; height: 14px; background: var(--hazard); }
    body::before { top: 0; }
    body::after { bottom: 0; }
    main { width: min(36rem, 100%); }
    h1 {
      font-weight: 900; text-transform: uppercase; letter-spacing: -.02em;
      font-size: clamp(2.6rem, 10vw, 6.5rem); line-height: .95; margin-bottom: 1.25rem;
    }
    p { font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.5; }
    a { color: inherit; overflow-wrap: anywhere; }

    /* The site's one address, big */
    .main-email { margin-top: clamp(1.5rem, 4vw, 2.5rem); }
    .main-email a {
      font-size: clamp(1.7rem, 6vw, 3rem); font-weight: 700; letter-spacing: -.01em;
      text-decoration-thickness: 3px; text-underline-offset: 8px;
    }

    .back { display: inline-block; margin-top: clamp(3.5rem, 8vw, 4.5rem); padding: .9rem 1.6rem; background: var(--smoke); color: var(--yellow); text-decoration: none; font-weight: 600; }
    .back:hover { background: #000; }
    a:focus-visible { outline: 3px solid var(--smoke); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Contact us</h1>
    <p class="main-email"><a href="mailto:info@Quadrozzi.com">info@Quadrozzi.com</a></p>
    <a class="back" href="../">Back to Quadrozzi</a>
  </main>
</body>
</html>
