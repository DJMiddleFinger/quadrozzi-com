<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quadrozzi</title>
  <meta name="description" content="Quadrozzi, Brooklyn, New York.">
  <meta name="theme-color" content="#ffe641">
  <script>
    // The Q drops in once per browser session; later visits in the same session show it already landed.
    try {
      if (!sessionStorage.getItem('q-dropped') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('drop');
      }
      sessionStorage.setItem('q-dropped', '1');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #ffe641;      /* matches the Q logo tile */
      --smoke: #161616;
      --ivory: #f3f1ec;
      --stone: rgba(243, 241, 236, .6);
      --line: rgba(243, 241, 236, .16);
      --hazard: repeating-linear-gradient(-45deg, #f6d31c 0 12px, #161616 12px 24px);
      --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden; background: var(--yellow); color: var(--smoke);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Face page: the logo, nothing else ---------- */
    .face { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
    .face h1 { display: contents; }
    .face figure { position: relative; height: 100svh; max-width: 100vw; aspect-ratio: 1455 / 2000; }
    .face img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* The logo file has white rounded bottom corners; paint them yellow so the page is one flat field */
    .face figure::before, .face figure::after {
      content: ''; position: absolute; bottom: 0; width: 15%; height: 11.5%; background: var(--yellow);
    }
    .face figure::before { left: 0; }
    .face figure::after { right: 0; }

    /* Crusher drop: the Q falls from above the screen, gathering speed, and lands hard with a short rebound */
    .drop .face figure { transform-origin: 50% 100%; animation: crush 1.15s .35s both; }
    @keyframes crush {
      0%   { transform: translateY(-102%); animation-timing-function: cubic-bezier(.65, 0, 1, .55); }
      58%  { transform: translateY(0) scaleY(.985); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
      72%  { transform: translateY(-1.8%) scaleY(1); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
      82%  { transform: translateY(0) scaleY(.995); animation-timing-function: ease-out; }
      100% { transform: none; }
    }

    /* ---------- Menu button: four bars, top left ---------- */
    .menu-toggle {
      position: fixed; z-index: 30; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
      width: 56px; height: 56px; border: 0; background: none; color: var(--smoke); cursor: pointer;
    }
    .menu-toggle i {
      position: absolute; left: 12px; right: 12px; height: 3px; border-radius: 2px; background: currentColor;
      transition: transform .35s var(--ease), opacity .2s, background .3s;
    }
    .menu-toggle i:nth-child(1) { top: 14px; }
    .menu-toggle i:nth-child(2) { top: 22px; }
    .menu-toggle i:nth-child(3) { top: 30px; }
    .menu-toggle i:nth-child(4) { top: 38px; }
    .menu-toggle:focus-visible { outline: 3px solid currentColor; outline-offset: -4px; border-radius: 6px; }
    .menu-open .menu-toggle { color: var(--ivory); }
    .menu-open .menu-toggle i:nth-child(1), .menu-open .menu-toggle i:nth-child(4) { opacity: 0; }
    .menu-open .menu-toggle i:nth-child(2) { transform: translateY(5px) rotate(45deg); }
    .menu-open .menu-toggle i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

    /* ---------- Side panel ---------- */
    .scrim {
      position: fixed; inset: 0; z-index: 10; background: rgba(22, 22, 22, .35);
      opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility 0s linear .4s;
    }
    .menu {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(760px, 100%);
      display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
      padding: 104px calc(clamp(24px, 6vw, 72px) + 10px) calc(2rem + env(safe-area-inset-bottom)) clamp(24px, 6vw, 72px);
      color: var(--ivory);
      /* asphalt panel with a hazard-striped right edge */
      background: linear-gradient(var(--smoke), var(--smoke)) 0 0 / calc(100% - 10px) 100% no-repeat, var(--hazard);
      transform: translateX(-100%); visibility: hidden;
      transition: transform .5s cubic-bezier(.7, 0, .2, 1), visibility 0s linear .5s;
    }
    .menu-open .menu, .menu-open .scrim { visibility: visible; transition-delay: 0s; }
    .menu-open .menu { transform: none; }
    .menu-open .scrim { opacity: 1; }

    .ventures { list-style: none; border-top: 1px solid var(--line); }
    .ventures li { border-bottom: 1px solid var(--line); }
    .ventures a { display: block; padding: 1.1rem 0 1.3rem; color: inherit; text-decoration: none; }
    .ventures .name {
      display: block; font-family: var(--display); font-weight: 800; text-transform: uppercase;
      font-size: clamp(3.2rem, 10vw, 6.75rem); line-height: .86; letter-spacing: -.005em;
      transition: color .2s;
    }
    .ventures .what { display: block; margin-top: .55rem; font-size: .95rem; color: var(--stone); }
    .ventures a:hover .name { color: var(--yellow); }
    .ventures a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }

    .menu-foot { margin-top: auto; padding-top: 2.5rem; font-size: .9rem; line-height: 1.8; color: var(--stone); }
    .menu-foot em { display: block; color: var(--ivory); }
    .menu-foot a { color: var(--ivory); text-underline-offset: 3px; }
    .menu-foot a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
  </style>
</head>
<body>
  <main class="face" id="main">
    <h1>
      <figure><img src="assets/q-logo.jpg" alt="Quadrozzi" width="1455" height="2000"></figure>
    </h1>
  </main>

  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
    <i></i><i></i><i></i><i></i>
  </button>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="menu" id="menu" aria-label="Quadrozzi companies" inert>
    <ul class="ventures">
      <li><a href="gbx/"><span class="name">GBX</span><span class="what">Gowanus Bay Terminal</span></a></li>
      <li><a href="https://djmiddlefinger.github.io/be-brooklyn-equine/" target="_blank" rel="noopener"><span class="name">BE</span><span class="what">Brooklyn Equine ↗<span class="sr-only"> (opens in a new tab)</span></span></a></li>
      <li><a href="helping-hooves/"><span class="name">Helping Hoof Initiative</span><span class="what">Horses and community in Brooklyn</span></a></li>
    </ul>
    <p class="menu-foot">
      <em>“We don’t mean business, we make it.”</em>
      <a href="mailto:info@quadrozzi.com">info@quadrozzi.com</a>
    </p>
  </nav>

  <script>
    (function () {
      var toggle = document.querySelector('.menu-toggle');
      var menu = document.getElementById('menu');
      var face = document.getElementById('main');
      function setMenu(open) {
        document.body.classList.toggle('menu-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        menu.inert = !open;
        face.inert = open;
        if (open) menu.querySelector('a').focus();
      }
      toggle.addEventListener('click', function () { setMenu(!document.body.classList.contains('menu-open')); });
      document.querySelector('.scrim').addEventListener('click', function () { setMenu(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); toggle.focus(); }
      });
    })();
  </script>
</body>
</html>
