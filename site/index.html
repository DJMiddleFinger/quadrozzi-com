<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quadrozzi</title>
  <meta name="description" content="Quadrozzi, Brooklyn, New York.">
  <meta name="theme-color" content="#ffe641">
  <script>
    // The Q drops in once per browser session; later visits in the same session show it already landed.
    try {
      if (!sessionStorage.getItem('q-dropped') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('drop');
      }
      sessionStorage.setItem('q-dropped', '1');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #ffe641;      /* matches the Q logo tile */
      --smoke: #161616;
      --ivory: #f3f1ec;
      --stone: rgba(243, 241, 236, .6);
      --line: rgba(243, 241, 236, .16);
      --hazard: repeating-linear-gradient(-45deg, #f6d31c 0 12px, #161616 12px 24px);
      --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden; background: var(--yellow); color: var(--smoke);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Face page: the logo, nothing else ---------- */
    .face { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
    .face h1 { display: contents; }
    .face figure { position: relative; z-index: 1; height: min(100svh, 100vw * 2000 / 1455); aspect-ratio: 1455 / 2000; }
    .face img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* The logo file has white rounded bottom corners; paint them yellow so the page is one flat field */
    .face figure::before, .face figure::after {
      content: ''; position: absolute; bottom: 0; width: 15%; height: 11.5%; background: var(--yellow);
    }
    .face figure::before { left: 0; }
    .face figure::after { right: 0; }

    /* Intro: the page starts black; the Q, cut out as a chamfered block, drops through the black and tears it
       open in a V. The motion is simulated in the script at the bottom; these rules only set the starting state. */
    .drop .face { background: #000; }
    .drop .face figure {
      transform: translateY(-150vh); transform-origin: 50% 96.5%;
      clip-path: polygon(27% 35%, 73% 35%, 78% 38.6%, 78% 92.9%, 73% 96.5%, 27% 96.5%, 22% 92.9%, 22% 38.6%);
    }
    .drop .menu-toggle { opacity: 0; pointer-events: none; }
    .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ---------- Menu button: four bars, top left ---------- */
    .menu-toggle {
      position: fixed; z-index: 30; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
      width: 56px; height: 56px; border: 0; background: none; color: var(--smoke); cursor: pointer;
      transition: opacity .5s var(--ease);
    }
    .menu-toggle i {
      position: absolute; left: 12px; right: 12px; height: 3px; border-radius: 2px; background: currentColor;
      transition: transform .35s var(--ease), opacity .2s, background .3s;
    }
    .menu-toggle i:nth-child(1) { top: 14px; }
    .menu-toggle i:nth-child(2) { top: 22px; }
    .menu-toggle i:nth-child(3) { top: 30px; }
    .menu-toggle i:nth-child(4) { top: 38px; }
    .menu-toggle:focus-visible { outline: 3px solid currentColor; outline-offset: -4px; border-radius: 6px; }
    .menu-open .menu-toggle { color: var(--ivory); }
    .menu-open .menu-toggle i:nth-child(1), .menu-open .menu-toggle i:nth-child(4) { opacity: 0; }
    .menu-open .menu-toggle i:nth-child(2) { transform: translateY(5px) rotate(45deg); }
    .menu-open .menu-toggle i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

    /* ---------- Side panel ---------- */
    .scrim {
      position: fixed; inset: 0; z-index: 10; background: rgba(22, 22, 22, .35);
      opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility 0s linear .4s;
    }
    .menu {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(760px, 100%);
      display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
      padding: 104px calc(clamp(24px, 6vw, 72px) + 10px) calc(2rem + env(safe-area-inset-bottom)) clamp(24px, 6vw, 72px);
      color: var(--ivory);
      /* asphalt panel with a hazard-striped right edge */
      background: linear-gradient(var(--smoke), var(--smoke)) 0 0 / calc(100% - 10px) 100% no-repeat, var(--hazard);
      transform: translateX(-100%); visibility: hidden;
      transition: transform .5s cubic-bezier(.7, 0, .2, 1), visibility 0s linear .5s;
    }
    .menu-open .menu, .menu-open .scrim { visibility: visible; transition-delay: 0s; }
    .menu-open .menu { transform: none; }
    .menu-open .scrim { opacity: 1; }

    .ventures { list-style: none; border-top: 1px solid var(--line); }
    .ventures li { border-bottom: 1px solid var(--line); }
    .ventures a { display: block; padding: 1.1rem 0 1.3rem; color: inherit; text-decoration: none; }
    .ventures .name {
      display: block; font-family: var(--display); font-weight: 800; text-transform: uppercase;
      font-size: clamp(3.2rem, 10vw, 6.75rem); line-height: .86; letter-spacing: -.005em;
      transition: color .2s;
    }
    .ventures .keep-case { text-transform: none; }   /* "Be" is always written Be, never uppercased */
    .ventures .what { display: block; margin-top: .55rem; font-size: .95rem; color: var(--stone); }
    .ventures a:hover .name { color: var(--yellow); }
    .ventures a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }

    .menu-foot { margin-top: auto; padding-top: 2.5rem; font-size: .9rem; line-height: 1.8; color: var(--stone); }
    .menu-foot em { display: block; color: var(--ivory); }
    .menu-foot a { color: var(--ivory); text-underline-offset: 3px; }
    .menu-foot a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    .menu-foot .contact {
      display: inline-block; margin-top: 1rem; padding: .85rem 1.4rem;
      background: var(--yellow); color: var(--smoke); text-decoration: none; font-weight: 600;
    }
    .menu-foot .contact:hover { background: #fff; }

    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
  </style>
</head>
<body>
  <main class="face" id="main">
    <h1>
      <figure><img src="assets/q-logo.jpg" alt="Quadrozzi" width="1455" height="2000"></figure>
    </h1>
  </main>

  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
    <i></i><i></i><i></i><i></i>
  </button>
  <div class="scrim" aria-hidden="true"></div>

  <nav class="menu" id="menu" aria-label="Quadrozzi companies" inert>
    <ul class="ventures">
      <li><a href="gbx/"><span class="name">GBX</span><span class="what">Gowanus Bay Terminal</span></a></li>
      <li><a href="https://djmiddlefinger.github.io/be-brooklyn-equine/" target="_blank" rel="noopener"><span class="name keep-case">Be</span><span class="what">Brooklyn Equine ↗<span class="sr-only"> (opens in a new tab)</span></span></a></li>
      <li><a href="helping-hooves/"><span class="name">Helping Hoof Initiative</span><span class="what">Horses and community in Brooklyn</span></a></li>
    </ul>
    <p class="menu-foot">
      <em>“We don’t mean business, we make it.”</em>
      <a class="contact" href="contact/">Contact us</a>
    </p>
  </nav>

  <script>
    // ---------- Intro: the Q block drops through a black sheet, tearing it open in a V ----------
    // Gravity, tearing drag, a heavy low bounce, then the two torn halves fall away and shed crumbs.
    (function () {
      var root = document.documentElement;
      if (!root.classList.contains('drop')) return;
      var face = document.getElementById('main');
      var fig = face.querySelector('figure');
      function finish() {
        face.querySelectorAll('.fx').forEach(function (c) { c.remove(); });
        face.style.background = '';
        fig.style.transform = '';
        root.classList.remove('drop');
      }
      try {
        var W = face.clientWidth, H = face.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
        var layer = function (z) {
          var c = document.createElement('canvas');
          c.className = 'fx'; c.style.zIndex = z;
          c.width = W * dpr; c.height = H * dpr;
          face.appendChild(c);
          return c.getContext('2d');
        };
        var sheet = layer(0), dust = layer(2);   // black sheet behind the Q, crumbs in front of it

        // The block, in px; fractions match the CSS clip-path
        var fx = fig.offsetLeft, fy = fig.offsetTop, fw = fig.offsetWidth, fh = fig.offsetHeight;
        var cx = fx + fw / 2, half = .28 * fw, chx = .05 * fw, chy = .036 * fh;
        var topOf = function (o) { return fy + .35 * fh + o; };
        var botOf = function (o) { return fy + .965 * fh + o; };

        var halfB = half - chx;   // half-width of the block's flat bottom
        var g = 3.4 * H;          // gravity, scaled to the screen so the fall takes about 0.8s anywhere
        var SPREAD = .26;         // how far the torn flaps spring open behind the block's bottom, per px of height
        var LEAD = .1 * H;        // how far the tear runs ahead of the block
        var o = -botOf(0) - 4, v = 0, landed = false, settled = false, squash = 0;
        var crackY = 0, pieces = null;

        // Jagged edges: fixed random offsets every 14px down each tear, interpolated into a saw-tooth
        var STEP = 14;
        var jag = function () {
          var a = [];
          for (var i = 0; i <= H / STEP + 2; i++) a.push((Math.random() * 2 - 1) * (Math.random() < .15 ? 15 : 6));
          return a;
        };
        var nL = jag(), nR = jag(), nC = jag();
        var noise = function (a, y) {
          var i = Math.max(0, y / STEP), k = Math.min(Math.floor(i), a.length - 2), f = i - k;
          return a[k] * (1 - f) + a[k + 1] * f;
        };

        // One torn edge, top of the screen to the tip of the tear. s: -1 left, 1 right.
        // The V opens from the block's bottom corners, so yellow shows beside the block as soon as it enters,
        // and its tip runs LEAD px ahead of the block.
        var vEdgeX = function (s, y, bot) { return cx + s * (halfB + 3 + (bot - y) * SPREAD) + noise(s < 0 ? nL : nR, y); };
        var blockHalf = function (y, bot) { return y > bot - chy ? halfB + chx * (bot - y) / chy : half; };
        var edge = function (s, o, tip) {
          var top = topOf(o), bot = botOf(o), pts = [], y, x;
          for (y = 0; y < bot; y += 8) {
            x = vEdgeX(s, y, bot);
            if (y > top - 2) x = s * Math.max(s * (x - cx), blockHalf(y, bot) + 2) + cx;   // the block pushes the flap at least this far
            pts.push([x, y]);
          }
          for (y = bot; y < tip; y += 8) {
            var w = halfB * Math.pow(1 - (y - bot) / (tip - bot), 1.6);
            pts.push([cx + s * w + noise(nC, y) * .7, y]);
          }
          pts.push([cx, tip]);
          return pts;
        };
        var trace = function (ctx, s, pts) {
          ctx.moveTo(s < 0 ? 0 : W, 0);
          pts.forEach(function (p) { ctx.lineTo(p[0], p[1]); });
          ctx.lineTo(cx, H + 2); ctx.lineTo(s < 0 ? 0 : W, H + 2); ctx.closePath();
        };

        var crumbs = [];
        var spawn = function (x, y, n, vx, vy, jitter) {
          for (var i = 0; i < n; i++) {
            var big = Math.random() < .08, fine = !big && Math.random() < .4;
            crumbs.push({
              x: x, y: y, r: Math.random() * 6, vr: (Math.random() - .5) * 14,
              vx: vx + (Math.random() - .5) * jitter, vy: vy + (Math.random() - .5) * jitter,
              size: big ? 4 + Math.random() * 5 : fine ? .8 + Math.random() : 1.4 + Math.random() * 2.6,
              alpha: fine ? .55 : 1
            });
          }
        };

        var draw = function () {
          sheet.setTransform(dpr, 0, 0, dpr, 0, 0);
          sheet.clearRect(0, 0, W, H);
          sheet.fillStyle = '#000';
          if (pieces) {
            pieces.forEach(function (p) {
              sheet.save();
              sheet.translate(p.px + p.dx, p.py + p.dy); sheet.rotate(p.a); sheet.translate(-p.px, -p.py);
              sheet.beginPath(); trace(sheet, p.s, p.pts); sheet.fill();
              sheet.restore();
            });
          } else if (botOf(o) + LEAD <= 0) {
            sheet.fillRect(0, 0, W, H);
          } else {
            var end = Math.max(botOf(o) + LEAD, crackY);
            sheet.beginPath(); trace(sheet, -1, edge(-1, o, end)); trace(sheet, 1, edge(1, o, end)); sheet.fill();
          }
          dust.setTransform(dpr, 0, 0, dpr, 0, 0);
          dust.clearRect(0, 0, W, H);
          dust.fillStyle = '#000';
          crumbs.forEach(function (c) {
            dust.globalAlpha = c.alpha * Math.max(0, Math.min(1, (H - c.y) / (H * .2)));
            dust.setTransform(dpr, 0, 0, dpr, c.x * dpr, c.y * dpr);
            dust.rotate(c.r);
            dust.fillRect(-c.size / 2, -c.size / 3, c.size, c.size * .7);
          });
          dust.globalAlpha = 1;
          fig.style.transform = 'translateY(' + o + 'px) scaleY(' + (1 - .02 * squash) + ')';
        };

        var start = performance.now(), last = start, DELAY = 350;
        var frame = function (now) {
          var dt = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          if (now - start > DELAY) {
            // The block: free fall, slowed a little while it tears, then a heavy bounce or two
            if (!settled) {
              var tearing = !landed && botOf(o) + LEAD > 0;
              v += g * (tearing ? .82 : 1) * dt;
              o += v * dt;
              if (tearing) {
                // Crumbs break off all along both torn edges, more the faster the block tears
                var bot = botOf(o), n = Math.ceil(v * dt / 6);
                for (var k = 0; k < n; k++) {
                  var side = Math.random() < .5 ? -1 : 1, y = Math.random() * Math.max(bot, 1);
                  spawn(vEdgeX(side, y, bot), y, 1, -side * 30, 20, 140);
                }
              }
              if (o >= 0) {
                o = 0;
                if (!landed) {
                  landed = true; squash = 1; crackY = botOf(0) + LEAD;
                  for (var b = 0; b < 90; b++) {
                    var bx = (Math.random() * 2 - 1) * halfB;
                    spawn(cx + bx, botOf(0), 1, bx * 1.6, -120 - Math.random() * 220, 260);
                  }
                }
                if (v < 90) { v = 0; settled = true; } else v = -v * .12;
              }
            }
            squash *= Math.exp(-dt * 16);

            // The crack runs to the bottom of the screen, then the two halves come loose and fall away
            if (landed && !pieces) {
              crackY += 9000 * dt;
              spawn(cx, crackY - Math.random() * 60, 2, 0, 40, 160);
              if (crackY >= H) {
                pieces = [-1, 1].map(function (s) {
                  return { s: s, pts: edge(s, 0, H + 2), px: s < 0 ? cx / 2 : (cx + W) / 2, py: H / 2, dx: 0, dy: 0, a: 0,
                           vx: s * (120 + Math.random() * 90), vy: -90, va: s * (.3 + Math.random() * .25) };
                });
                for (var i = 0; i < 60; i++) {
                  var rs = i % 2 ? 1 : -1, ry = Math.random() * botOf(0);
                  spawn(vEdgeX(rs, ry, botOf(0)), ry, 1, rs * 60, 0, 200);
                }
              }
            }
            if (pieces) {
              pieces.forEach(function (p) {
                p.vy += g * dt; p.dx += p.vx * dt; p.dy += p.vy * dt; p.a += p.va * dt;
                if (p.dy < H * .5 && Math.random() < .7) {
                  var y = Math.random() * botOf(0);
                  spawn(vEdgeX(p.s, y, botOf(0)) + p.dx, y + p.dy, 1, p.vx * .5, p.vy * .5, 120);
                }
              });
            }

            // Crumbs: gravity, air drag and a little turbulence that scatters them sideways; gone at the bottom
            crumbs = crumbs.filter(function (c) {
              c.vx += (Math.random() - .5) * 1400 * dt;
              c.vx *= 1 - 1.2 * dt; c.vy += g * .8 * dt; c.vy *= 1 - .6 * dt;
              c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt;
              return c.y < H;
            });
          }
          draw();
          face.style.background = 'none';
          var gone = pieces && pieces.every(function (p) { return p.dy > H * 1.2; });
          if (settled && gone && !crumbs.length) finish();
          else requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      } catch (e) {
        finish();
      }
    })();

    (function () {
      var toggle = document.querySelector('.menu-toggle');
      var menu = document.getElementById('menu');
      var face = document.getElementById('main');
      function setMenu(open) {
        document.body.classList.toggle('menu-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        menu.inert = !open;
        face.inert = open;
        if (open) menu.querySelector('a').focus();
      }
      toggle.addEventListener('click', function () { setMenu(!document.body.classList.contains('menu-open')); });
      document.querySelector('.scrim').addEventListener('click', function () { setMenu(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); toggle.focus(); }
      });
    })();
  </script>
</body>
</html>
