<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,401,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root { --smoke: #161616; --ivory: #f3f1ec; --orange: #e8741e; --yellow: #f6d31c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 2rem 16px;
      background: var(--smoke); color: var(--ivory); border-top: 10px solid transparent; border-image: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--smoke) 14px 28px) 10; font-family: 'Satoshi', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
    }
    .eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--yellow); }
    h1 {
      color: var(--yellow);
      font-weight: 900; text-transform: uppercase;
      font-size: clamp(5rem, 22vw, 14rem); line-height: .85; margin: 1rem 0 1.25rem;
    }
    p { font-style: italic; font-size: clamp(1.3rem, 3vw, 1.7rem); opacity: .85; margin-bottom: 2.25rem; }
    a {
      display: inline-block; padding: .9rem 1.6rem; border-radius: 999px; background: var(--orange); color: var(--smoke);
      text-decoration: none; font-size: .8rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    }
    a:hover { background: #f08a3a; }
    a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Page not found</span>
    <h1>404</h1>
    <p>This page has moved on — the harbor hasn't.</p>
    <a href="/" id="home">Return Home</a>
  </main>
  <script>
    // On a GitHub project site (user.github.io/repo/) the home page lives under the repo folder;
    // on a custom domain it is the root.
    if (location.hostname.endsWith('github.io')) {
      var repo = location.pathname.split('/')[1];
      if (repo) document.getElementById('home').href = '/' + repo + '/';
    }
  </script>
</body>
</html>
